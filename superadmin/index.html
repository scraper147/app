<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>SuperAdmin · Caisse</title><link rel="icon" href="../core/icons/admin-192.png">
<style>
:root{--c:#2F5D8A;--ink:#1A2230;--mut:#586273;--line:#DCE1E8;--bg:#F3F5F8;--red:#A33A2B;--ok:#1E7A3C}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#111A26;color:#EEF2F7;padding:16px 20px}header .in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{font-size:20px;margin:0;flex:1}header small{color:#A9B4C2}
nav.tabs{max-width:1080px;margin:0 auto;padding:12px 16px 0;display:flex;gap:8px}
nav.tabs button{background:#fff;color:var(--ink);border:1px solid var(--line)}nav.tabs button.on{background:var(--c);color:#fff;border-color:var(--c)}
main{max-width:1080px;margin:0 auto;padding:16px 16px 60px}
section{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
h2{font-size:18px;margin:0 0 10px}p{color:var(--mut);line-height:1.5;margin:6px 0}
label{display:block;font-weight:700;font-size:14px;margin:12px 0 4px}
input,select,textarea{width:100%;box-sizing:border-box;font:inherit;font-size:15px;padding:9px 10px;border:1px solid #C9D1DB;border-radius:10px;background:#fff}
textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;min-height:90px}textarea.note{font-family:inherit;font-size:14px;min-height:60px}
button,.b{font:inherit;font-weight:700;font-size:14px;padding:9px 14px;border:1px solid var(--c);border-radius:10px;background:var(--c);color:#fff;cursor:pointer;text-decoration:none;display:inline-block}
.b.sec,button.sec{background:#fff;color:var(--c)}button.danger{background:#fff;color:var(--red);border-color:var(--red)}button:disabled{opacity:.5;cursor:default}
header button{background:transparent;border-color:#3A4757;color:#EEF2F7}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.card{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.card h3{margin:0;font-size:17px}.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:#E8F0F8;color:var(--c)}.tag.gh{background:#E6F4EA;color:var(--ok)}.tag.warn{background:#FBEDE3;color:#7A3D00}.tag.so{background:#F1E8FA;color:#6A3F99}
.msg{font-weight:600;margin-top:8px}.ok{color:var(--ok)}.err{color:var(--red)}.faint{color:var(--mut);font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:640px){.two{grid-template-columns:1fr}}
.types{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:640px){.types{grid-template-columns:1fr}}
.type{border:2px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;display:block;font-weight:400;margin:0}.type.on{border-color:var(--c);background:#F3F7FB}.type b{display:block;font-size:15px}.type input{width:auto;margin-right:6px}
.filter{max-width:320px}
</style></head>

}
