<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>Guinguette Noel</title><link rel="icon" href="../core/icons/caisse-192.png">
<style>body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#F3F5F8;color:#1A2230;display:grid;place-items:center;min-height:100vh}
main{max-width:560px;padding:32px 20px;text-align:center}h1{font-size:30px;margin:12px 0 6px}p{color:#586273;line-height:1.5}
.row{display:grid;gap:14px;margin-top:26px}a{display:block;padding:18px 20px;border-radius:14px;background:#fff;border:1px solid #DCE1E8;text-decoration:none;color:inherit;text-align:left}
a b{display:block;font-size:18px;color:#2F5D8A}a span{color:#586273;font-size:14px}#logo{max-width:320px;max-height:90px}</style></head>
<body><main><img id="logo" src="../core/icons/caisse-192.png" alt=""><h1 id="nom">Guinguette Noel</h1><p>Choisissez l’application.</p>
<div class="row"><a href="caisse/"><b>Caisse</b><span>Vente : articles, panier, encaissement, ticket, caisse du jour</span></a>
<a href="soiree/"><b>Caisse Soirée</b><span>Option « Soirée à tickets » : entrées, cartes à cases, boissons, préventes</span></a>
<a href="admin/"><b>Admin</b><span>Catalogue, stock, caisse, commandes, factures, livraisons, bilan, paramètres</span></a></div></main>
<script src="client.js"></script>
<script>try { var P = 'caisse:' + window.CLIENT.id + ':', t = {}; ['admin-apparence', 'caisse-apparence'].forEach(function (k) { var o = JSON.parse(localStorage.getItem(P + k) || 'null'); if (o && o.t && !t.nom) t = o.t; });
if (t.nom) { document.getElementById('nom').textContent = t.nom; document.title = t.nom; } if (t.logo) document.getElementById('logo').src = t.logo; if (t.couleur) document.querySelectorAll('a b').forEach(function (b) { b.style.color = t.couleur; }); } catch (e) {}</script>
</body></html>
